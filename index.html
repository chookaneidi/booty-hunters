<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booty Hunters</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="glass sticky top-0 z-50 px-4 py-3 border-b border-slate-700 flex justify-between items-center max-w-2xl mx-auto rounded-b-xl">
    <div class="flex items-center gap-2">
      <div class="p-2 bg-indigo-600 rounded-lg text-white"><i data-lucide="compass"></i></div>
      <div>
        <h1 class="font-bold text-lg leading-tight">Booty Hunters</h1>
        <p class="text-xs text-slate-400">Daily Scavenger Hunt</p>
      </div>
    </div>
    
    <!-- Player Switcher -->
    <div class="flex items-center gap-2 bg-slate-800 p-1 rounded-lg border border-slate-700 text-xs">
      <span class="text-slate-400 pl-2">Player:</span>
      <select id="playerSelect" onchange="switchPlayer(this.value)" class="bg-slate-700 text-white px-2 py-1 rounded font-semibold focus:outline-none">
        <option value="Player 1">Player 1</option>
        <option value="Player 2">Player 2</option>
      </select>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">

    <!-- Today's Prompt Banner -->
    <section class="glass p-6 rounded-2xl text-center relative overflow-hidden border-indigo-500/30 border">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
      <span class="text-xs font-semibold uppercase tracking-wider text-indigo-400 bg-indigo-950/60 px-3 py-1 rounded-full border border-indigo-800/50">Today's Target</span>
      <h2 id="todayPrompt" class="text-2xl font-black mt-3 text-white">Loading target...</h2>
      <p class="text-xs text-slate-400 mt-2">Unlocks daily at 9:00 AM local time</p>
    </section>

    <!-- Upload Section -->
    <section class="glass p-6 rounded-2xl space-y-4">
      <h3 class="font-bold text-slate-200 flex items-center gap-2">
        <i data-lucide="upload-cloud" class="text-indigo-400"></i> Submit Your Booty
      </h3>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Photo Title</label>
          <input type="text" id="photoTitle" placeholder="e.g. Masterpiece in the wild" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Select Image</label>
          <input type="file" id="photoInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer" />
        </div>

        <div class="flex gap-2 pt-1">
          <button onclick="handleUpload()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
            <i data-lucide="check"></i> Submit Photo
          </button>
          
          <button onclick="handleAdmitDefeat()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 border border-rose-500/30 font-semibold px-4 py-2.5 rounded-lg text-sm transition flex items-center gap-1.5" title="Wave the white flag for today!">
            <i data-lucide="flag" class="w-4 h-4 text-rose-400"></i> Admit Defeat
          </button>
        </div>
      </div>
    </section>

    <!-- Side-by-Side Arena -->
    <section class="glass p-6 rounded-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="swords" class="text-amber-400"></i> Daily Showdown
        </h3>
        <span id="speedWinner" class="text-xs font-bold text-emerald-400 bg-emerald-950/80 px-2.5 py-1 rounded-full border border-emerald-800/50">Fair Timezone Calc</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="arenaGrid">
        <!-- Photo cards rendered dynamically -->
      </div>
    </section>

    <!-- Leaderboard & Stats -->
    <section class="glass p-6 rounded-2xl space-y-4">
      <h3 class="font-bold text-slate-200 flex items-center gap-2">
        <i data-lucide="trophy" class="text-yellow-400"></i> Hunter Leaderboard
      </h3>
      <div id="leaderboard" class="space-y-2 text-sm">
        <!-- Rendered dynamically -->
      </div>
    </section>

  </main>

  <script>
    // --- 50 DAILY SCAVENGER PROMPTS (1/3 DOUBLE ENTENDRES) ---
    const PROMPTS = [
      // Double Entendres / Cheeky Visuals (17)
      "Something round and soft",
      "Something rock hard",
      "The longest thing in your room",
      "A set of two nice ovals",
      "Something wet and slippery",
      "Something hairy in an odd spot",
      "Something that vibrates",
      "Something that needs a good wipe",
      "Something extra juicy",
      "Something long, thin, and bendy",
      "Something tight that takes effort to open",
      "Something that fits in something else",
      "Something you would put in your mouth",
      "Something that fits perfectly in your hand",
      "Something dirty that needs washing",
      "A pair that clearly belongs together",
      "Something you'd want to be wet",

      // Classic & Quirky Visual Targets (33)
      "Something bright blue",
      "A curious shadow",
      "An unusually shaped leaf",
      "Something vintage or retro",
      "Reflections in water or glass",
      "A handwritten sign or note",
      "Something surprisingly tiny",
      "A pattern found in nature",
      "An item with a funny typo or name",
      "Something vibrant yellow",
      "A cozy corner",
      "Something that makes you smile",
      "An unexpected texture",
      "A cool architectural detail",
      "Something red in an unlikely place",
      "Street art or a cool sticker",
      "Something rounder than expected",
      "A stack of three or more things",
      "Something geometric",
      "An item that has seen better days",
      "Something metallic that shines",
      "A splash of bright orange",
      "A sign with an unusual rule",
      "Something perfectly symmetrical",
      "An object that looks like a face",
      "A view through a narrow gap",
      "Something boldly striped",
      "High contrast light and dark",
      "Something green that isn't a plant",
      "A fancy or favorite mug",
      "A quirky pair of socks or shoes",
      "Something deep purple",
      "A warm cup of coffee or tea"
    ];

    let currentUser = "Player 1";
    
    function getTodayPrompt() {
      const today = new Date().toDateString();
      let hash = 0;
      for (let i = 0; i < today.length; i++) hash = today.charCodeAt(i) + ((hash << 5) - hash);
      return PROMPTS[Math.abs(hash) % PROMPTS.length];
    }

    function getElapsedSince9AM() {
      const now = new Date();
      const nineAM = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 9, 0, 0, 0);
      const diffSeconds = Math.floor((now - nineAM) / 1000);
      return diffSeconds > 0 ? diffSeconds : 0;
    }

    function formatElapsed(seconds) {
      if (seconds === null || seconds >= 999990) return "Defeated 🏳️";
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      return `${hrs}h ${mins}m ${secs}s after 9 AM`;
    }

    function getStoredData() {
      const data = localStorage.getItem("bootyhunters_data");
      return data ? JSON.parse(data) : {};
    }

    function saveData(data) {
      localStorage.setItem("bootyhunters_data", JSON.stringify(data));
      render();
    }

    function switchPlayer(name) {
      currentUser = name;
      render();
    }

    function handleUpload() {
      const titleInput = document.getElementById("photoTitle");
      const fileInput = document.getElementById("photoInput");

      if (!titleInput.value || !fileInput.files[0]) {
        alert("Please enter a photo title and select an image.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = getStoredData();
        const todayKey = new Date().toISOString().split('T')[0];

        if (!data[todayKey]) data[todayKey] = {};

        data[todayKey][currentUser] = {
          title: titleInput.value,
          image: e.target.result,
          defeated: false,
          uploadedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          elapsedSeconds: getElapsedSince9AM(),
          ratings: {},
          comments: []
        };

        saveData(data);
        titleInput.value = "";
        fileInput.value = "";
      };
      reader.readAsDataURL(fileInput.files[0]);
    }

    function handleAdmitDefeat() {
      if (!confirm("Are you sure you want to admit defeat today? This unlocks your friend's photo!")) return;

      const data = getStoredData();
      const todayKey = new Date().toISOString().split('T')[0];
      if (!data[todayKey]) data[todayKey] = {};

      data[todayKey][currentUser] = {
        title: "Admitted Defeat 🏳️",
        image: null,
        defeated: true,
        uploadedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        elapsedSeconds: 999999,
        ratings: {},
        comments: []
      };

      saveData(data);
    }

    function ratePhoto(player, stars) {
      const data = getStoredData();
      const todayKey = new Date().toISOString().split('T')[0];
      if (data[todayKey] && data[todayKey][player] && !data[todayKey][player].defeated) {
        data[todayKey][player].ratings[currentUser] = stars;
        saveData(data);
      }
    }

    function addComment(player, inputId) {
      const input = document.getElementById(inputId);
      if (!input.value) return;

      const data = getStoredData();
      const todayKey = new Date().toISOString().split('T')[0];
      if (data[todayKey] && data[todayKey][player]) {
        data[todayKey][player].comments.push({
          author: currentUser,
          text: input.value,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        saveData(data);
      }
    }

    function render() {
      document.getElementById("todayPrompt").innerText = `"${getTodayPrompt()}"`;
      const data = getStoredData();
      const todayKey = new Date().toISOString().split('T')[0];
      const todayData = data[todayKey] || {};

      const arenaGrid = document.getElementById("arenaGrid");
      arenaGrid.innerHTML = "";

      ["Player 1", "Player 2"].forEach(player => {
        const entry = todayData[player];
        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between";

        if (entry) {
          if (entry.defeated) {
            card.innerHTML = `
              <div>
                <div class="flex justify-between items-center mb-2">
                  <span class="font-bold text-rose-400">${player}</span>
                  <span class="text-xs text-slate-400">${entry.uploadedAt}</span>
                </div>
                <div class="w-full h-48 bg-rose-950/20 border-2 border-dashed border-rose-900/50 rounded-lg flex flex-col items-center justify-center text-rose-400 p-4 mb-2">
                  <i data-lucide="flag" class="w-8 h-8 mb-2 opacity-80"></i>
                  <p class="font-bold text-sm">Admitted Defeat</p>
                  <p class="text-xs text-rose-300/70 text-center mt-1">Couldn't find the booty today!</p>
                </div>
                <div class="space-y-1 text-xs border-t border-slate-800 pt-2 max-h-24 overflow-y-auto">
                  ${entry.comments.map(c => `<div><strong class="text-slate-300">${c.author}:</strong> ${c.text}</div>`).join('')}
                </div>
              </div>

              <div class="flex gap-2 mt-3 pt-2 border-t border-slate-800">
                <input type="text" id="comment-${player}" placeholder="Send comforting words..." class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs w-full text-white focus:outline-none" />
                <button onclick="addComment('${player}', 'comment-${player}')" class="bg-indigo-600 px-3 py-1 rounded text-xs font-semibold">Post</button>
              </div>
            `;
          } else {
            const avgRating = Object.values(entry.ratings).length 
              ? (Object.values(entry.ratings).reduce((a,b)=>a+b,0) / Object.values(entry.ratings).length).toFixed(1)
              : "Unrated";

            card.innerHTML = `
              <div>
                <div class="flex justify-between items-center mb-2">
                  <span class="font-bold text-indigo-400">${player}</span>
                  <span class="text-xs text-slate-400">${entry.uploadedAt}</span>
                </div>
                <img src="${entry.image}" class="w-full h-48 object-cover rounded-lg mb-2" />
                <h4 class="font-bold text-white text-sm mb-1">${entry.title}</h4>
                <p class="text-xs text-emerald-400 mb-3">⚡ Speed: ${formatElapsed(entry.elapsedSeconds)}</p>

                <div class="flex items-center gap-1 mb-3">
                  <span class="text-xs text-slate-400 mr-1">Rate:</span>
                  ${[1,2,3,4,5].map(s => `
                    <button onclick="ratePhoto('${player}', ${s})" class="text-sm ${ (entry.ratings[currentUser] >= s) ? 'text-amber-400' : 'text-slate-600' }">★</button>
                  `).join('')}
                  <span class="text-xs text-slate-400 ml-auto">Avg: ${avgRating}★</span>
                </div>

                <div class="space-y-1 text-xs border-t border-slate-800 pt-2 max-h-24 overflow-y-auto">
                  ${entry.comments.map(c => `<div><strong class="text-slate-300">${c.author}:</strong> ${c.text}</div>`).join('')}
                </div>
              </div>

              <div class="flex gap-2 mt-3 pt-2 border-t border-slate-800">
                <input type="text" id="comment-${player}" placeholder="Add comment..." class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs w-full text-white focus:outline-none" />
                <button onclick="addComment('${player}', 'comment-${player}')" class="bg-indigo-600 px-3 py-1 rounded text-xs font-semibold">Post</button>
              </div>
            `;
          }
        } else {
          card.innerHTML = `
            <div class="text-center py-12 text-slate-500">
              <i data-lucide="clock" class="mx-auto mb-2 opacity-50"></i>
              <p class="text-xs font-semibold">${player} has not uploaded yet today.</p>
            </div>
          `;
        }
        arenaGrid.appendChild(card);
      });

      const leaderboard = document.getElementById("leaderboard");
      leaderboard.innerHTML = `
        <div class="flex justify-between p-2.5 bg-slate-900 rounded-lg">
          <span class="font-semibold text-slate-200">Player 1</span>
          <span class="text-xs text-emerald-400 font-mono flex items-center gap-1">⚡ Active Hunter</span>
        </div>
        <div class="flex justify-between p-2.5 bg-slate-900 rounded-lg">
          <span class="font-semibold text-slate-200">Player 2</span>
          <span class="text-xs text-emerald-400 font-mono flex items-center gap-1">⚡ Active Hunter</span>
        </div>
      `;

      lucide.createIcons();
    }

    render();
  </script>
</body>
</html>
